<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="1100" height="644" viewBox="0 0 1100 644" role="img" aria-labelledby="title description">
  <title id="title">电脑、ESP32-S3 与 iPhone 如何连接</title>
  <desc id="description">USB HID 模式下，电脑接 ESP32-S3 的 USB-UART 口，iPhone 接原生 USB/OTG。BLE HID 模式下保留电脑的 USB 数据线，原生 USB 口留空，开发板直接和 iPhone 蓝牙配对。AirPlay 独立从手机向电脑回传画面。</desc>
  <defs>
    <marker id="serial-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#23619a"/>
    </marker>
    <marker id="usb-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#14715b"/>
    </marker>
    <marker id="radio-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#7549a8"/>
    </marker>
    <marker id="air-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#526583"/>
    </marker>
    <g id="pc">
      <rect x="2" y="2" width="70" height="49" rx="7" fill="#dfedfa" stroke="#255280" stroke-width="3"/>
      <path d="M10 41 H64 M37 51 V64 M20 64 H54" fill="none" stroke="#255280" stroke-width="3" stroke-linecap="round"/>
      <path d="M17 16 L26 23 L17 30 M33 30 H47" fill="none" stroke="#23619a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="board">
      <rect x="3" y="2" width="58" height="69" rx="8" fill="#244b48" stroke="#173535" stroke-width="2.5"/>
      <path d="M11 10 V61 M53 10 V61" fill="none" stroke="#b3dac8" stroke-width="4" stroke-dasharray="2.5 5.4" stroke-linecap="round"/>
      <path d="M23 12 H41 V16 H28 V20 H38" fill="none" stroke="#96cfaa" stroke-width="2"/>
      <rect x="20" y="24" width="24" height="22" rx="4" fill="#d2e1e3" stroke="#93b1b3" stroke-width="1.5"/>
      <rect x="22" y="52" width="6" height="6" rx="1" fill="#f4cc79"/>
      <rect x="36" y="52" width="6" height="6" rx="1" fill="#f4cc79"/>
      <rect x="15" y="63" width="15" height="9" rx="2" fill="#b8cbd1" stroke="#173535" stroke-width="1"/>
      <rect x="34" y="63" width="15" height="9" rx="2" fill="#b8cbd1" stroke="#173535" stroke-width="1"/>
    </g>
    <g id="phone">
      <rect x="3" y="1" width="42" height="70" rx="10" fill="#e8e7f6" stroke="#463c64" stroke-width="3"/>
      <path d="M19 8 H29 M19 64 H29" stroke="#463c64" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="10" y="15" width="28" height="43" rx="5" fill="#f8faff"/>
      <path d="M16 32 H32 M16 39 H28" stroke="#907eb9" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill:#17243a; }
    .title { font-size:35px; font-weight:750; }
    .sub { font-size:21px; fill:#405576; }
    .panel { fill:#fff; stroke:#d4dfeb; stroke-width:1.7; }
    .mode { font-size:23px; font-weight:700; }
    .label { font-size:22px; font-weight:700; }
    .wire { font-size:20px; font-weight:700; }
    .small { font-size:18px; fill:#394d68; }
    .note { font-size:17px; fill:#526583; }
    .blue { fill:#23619a; }
    .green { fill:#14715b; }
    .purple { fill:#654293; }
    .serial,.usb,.radio,.air { fill:none; stroke-width:4; stroke-linecap:round; }
    .serial { stroke:#23619a; }
    .usb { stroke:#14715b; }
    .radio { stroke:#7549a8; stroke-dasharray:7 8; }
    .air { stroke:#526583; stroke-dasharray:7 8; }
  </style>
  <rect width="1100" height="644" rx="30" fill="#f0f5fb"/>
  <text x="44" y="56" class="title" text-anchor="start">电脑、ESP32-S3 与 iPhone 如何连接</text>
  <text x="45" y="89" class="sub" text-anchor="start">两种模式下，电脑都接开发板的 USB-UART 口。</text>
  <g transform="translate(0 116)">
    <rect x="28" y="0" width="1044" height="196" rx="24" class="panel"/>
    <text x="56" y="37" class="mode" text-anchor="start">USB HID · 两根 USB 数据线</text>
    <use href="#pc" x="123" y="59"/>
    <use href="#board" x="518" y="56"/>
    <use href="#phone" x="916" y="58"/>
    <path d="M 211 104 H 507" class="serial" marker-end="url(#serial-arrow)"/>
    <text x="359" y="90" class="wire blue" text-anchor="middle">USB 数据线 → USB-UART</text>
    <text x="359" y="134" class="small" text-anchor="middle">串口 · 烧录 · 供电</text>
    <path d="M 594 104 H 898" class="usb" marker-end="url(#usb-arrow)"/>
    <text x="746" y="90" class="wire green" text-anchor="middle">USB 数据线</text>
    <text x="746" y="134" class="small" text-anchor="middle">原生 USB / OTG</text>
    <text x="160" y="163" class="label" text-anchor="middle">Windows 电脑</text>
    <text x="550" y="163" class="label" text-anchor="middle">ESP32-S3 开发板</text>
    <text x="940" y="163" class="label" text-anchor="middle">iPhone</text>
  </g>
  <g transform="translate(0 326)">
    <rect x="28" y="0" width="1044" height="196" rx="24" class="panel"/>
    <text x="56" y="37" class="mode" text-anchor="start">BLE HID · 一根 USB 数据线</text>
    <use href="#pc" x="123" y="59"/>
    <use href="#board" x="518" y="56"/>
    <use href="#phone" x="916" y="58"/>
    <path d="M 211 104 H 507" class="serial" marker-end="url(#serial-arrow)"/>
    <text x="359" y="90" class="wire blue" text-anchor="middle">USB 数据线 → USB-UART</text>
    <text x="359" y="134" class="small" text-anchor="middle">串口 · 烧录 · 供电</text>
    <path d="M 594 104 H 898" class="radio" marker-end="url(#radio-arrow)"/>
    <text x="746" y="90" class="wire purple" text-anchor="middle">BLE HID</text>
    <text x="746" y="134" class="small" text-anchor="middle">蓝牙键盘 / 鼠标</text>
    <text x="160" y="163" class="label" text-anchor="middle">Windows 电脑</text>
    <text x="550" y="163" class="label" text-anchor="middle">ESP32-S3 开发板</text>
    <text x="940" y="163" class="label" text-anchor="middle">iPhone</text>
    <text x="746" y="165" class="note" text-anchor="middle">原生 USB / OTG 口留空</text>
  </g>
  <rect x="28" y="537" width="1044" height="81" rx="20" fill="#e3edf7"/>
  <text x="550" y="567" class="mode" text-anchor="middle">画面回传 · 通过网络使用 AirPlay</text>
  <text x="220" y="598" class="small" text-anchor="middle">电脑上的 UxPlay / 取帧</text>
  <path d="M 708 592 H 390" class="air" marker-end="url(#air-arrow)"/>
  <text x="875" y="598" class="small" text-anchor="middle">iPhone 屏幕镜像</text>
</svg>
