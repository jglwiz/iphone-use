name: CI

on:
  push:
    branches: [main, release-1.0]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR cancels the superseded run; branch pushes always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e capture
      - name: Independent frame and lifecycle contracts (no receiver or hardware)
        run: python -m unittest discover -s capture/tests -v

  hid-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Offline HID evidence server contract
        run: python -m unittest discover -s hardware/tests/hid_acceptance -p test_server.py -v

  # Store-only sources never belong in this repository (scripts/check-public.sh).
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-public.sh

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "NimBLE-Arduino@2.5.1"
      - name: Build
        run: hardware/flash.sh --build-only
      - name: Build (absolute mouse)
        run: hardware/flash.sh --abs --build-only
      - name: Host tests (bplist, GOP buffer, CLI protocol, Bonjour TXT, …)
        run: |
          sudo apt-get install -y libmbedtls-dev
          make -C hardware/tests

  serial-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "NimBLE-Arduino@2.3.8"
      - name: Build serial USB/BLE HID
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=default,FlashSize=16M,PSRAM=opi,PartitionScheme=default_8MB hardware/serial_hid
